{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
    }
    
    .genealogy-container {
        display: flex;
        height: calc(100vh - 100px);
        gap: 15px;
        padding: 15px;
        background: #f5f5f5;
    }
    
    .controls {
        width: 300px;
        background: white;
        border-radius: 8px;
        padding: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        overflow-y: auto;
    }
    
    .diagram-container {
        flex: 1;
        background: white;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        position: relative;
    }
    
    #myDiagramDiv {
        width: 100%;
        height: 100%;
        background: #ffffff;
    }
    
    .control-group {
        margin-bottom: 20px;
    }
    
    .control-group label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 14px;
        color: #333;
    }
    
    .control-group input,
    .control-group select,
    .control-group button {
        width: 100%;
        padding: 8px 12px;
        font-size: 13px;
        border: 1px solid #ddd;
        border-radius: 4px;
        margin-bottom: 5px;
    }
    
    .control-group button {
        background: #4CAF50;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    
    .control-group button:hover {
        background: #45a049;
    }
    
    .control-group button.secondary {
        background: #2196F3;
    }
    
    .control-group button.secondary:hover {
        background: #0b7dda;
    }
    
    .info-panel {
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 10px;
        margin-top: 15px;
        font-size: 12px;
        max-height: 200px;
        overflow-y: auto;
    }
    
    .info-item {
        margin-bottom: 8px;
        padding-bottom: 8px;
        border-bottom: 1px solid #eee;
    }
    
    .info-item:last-child {
        border-bottom: none;
    }
    
    .legend {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #ddd;
    }
    
    .legend-item {
        display: flex;
        align-items: center;
        margin-bottom: 8px;
        font-size: 12px;
    }
    
    .legend-color {
        width: 20px;
        height: 20px;
        margin-right: 8px;
        border-radius: 3px;
        border: 1px solid #333;
    }
    
    .warning {
        background: #fff3cd;
        border: 1px solid #ffc107;
        color: #856404;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 10px;
        font-size: 12px;
    }
    
    .stats {
        background: #e8f5e9;
        padding: 10px;
        border-radius: 4px;
        margin-bottom: 10px;
        font-size: 12px;
    }
    
    .stats div {
        margin: 3px 0;
    }
</style>
{% endblock %}

{% block content %}
<div class="genealogy-container">
    <div class="controls">
        <h3 style="margin-top: 0;">Phả Đồ Gia Phả Họ Trần</h3>
        
        <div class="stats" id="statsPanel">
            <div><strong>Tổng số người:</strong> <span id="totalPeople">0</span></div>
            <div><strong>Tổng quan hệ:</strong> <span id="totalRelationships">0</span></div>
            <div><strong>Thế hệ:</strong> <span id="generationRange">4-12</span></div>
        </div>
        
        <div class="control-group">
            <label for="genealogySelect">Chọn Gia Phả:</label>
            <select id="genealogySelect" onchange="loadGenealogy()">
                <option value="">-- Tải Gia Phả --</option>
            </select>
        </div>
        
        <div class="control-group">
            <label for="searchInput">Tìm Kiếm:</label>
            <input type="text" id="searchInput" placeholder="Nhập tên người..." 
                   onkeyup="searchPerson(this.value)">
        </div>
        
        <div class="control-group">
            <button onclick="zoomToFit()">Zoom Vừa Vặn</button>
            <button onclick="centerDiagram()">Căn Giữa</button>
            <button class="secondary" onclick="exportAsImage()">Export Ảnh</button>
            <button class="secondary" onclick="downloadJSON()">Download JSON</button>
        </div>
        
        <div class="control-group">
            <label for="viewMode">Chế Độ Xem:</label>
            <select id="viewMode" onchange="changeViewMode()">
                <option value="tree">Phả Đồ Thẳng</option>
                <option value="relationship">Mối Quan Hệ</option>
            </select>
        </div>
        
        <div class="control-group">
            <label for="filterGeneration">Lọc Thế Hệ:</label>
            <select id="filterGeneration" onchange="filterByGeneration()">
                <option value="">-- Tất Cả --</option>
                <option value="4">Đời thứ 4</option>
                <option value="5">Đời thứ 5</option>
                <option value="6">Đời thứ 6</option>
                <option value="7">Đời thứ 7</option>
                <option value="8">Đời thứ 8</option>
                <option value="9">Đời thứ 9</option>
                <option value="10">Đời thứ 10</option>
                <option value="11">Đời thứ 11</option>
                <option value="12">Đời thứ 12</option>
            </select>
        </div>
        
        <div class="info-panel">
            <div id="selectedInfo" style="display: none;">
                <strong>Thông Tin Người</strong>
                <div id="personInfo" class="info-item"></div>
            </div>
            <div id="noSelection" style="font-style: italic; color: #999;">
                Nhấn vào một nút để xem thông tin
            </div>
        </div>
        
        <div class="legend">
            <strong>Chú Thích:</strong>
            <div class="legend-item">
                <div class="legend-color" style="background: #FFD700;"></div>
                <span>Nam (Đinh)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FFB6C1;"></div>
                <span>Nữ (Dâu)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #87CEEB;"></div>
                <span>Khác</span>
            </div>
        </div>
    </div>
    
    <div class="diagram-container">
        <div id="myDiagramDiv"></div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gojs/2.3.9/go.js"></script>
<script src="{% static 'js/genealogy-viewer.js' %}"></script>

<script>
    // Load genealogies on page load
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/api/genealogy/')
            .then(r => r.json())
            .then(data => {
                const select = document.getElementById('genealogySelect');
                data.results.forEach(gen => {
                    const option = document.createElement('option');
                    option.value = gen.id;
                    option.text = gen.name;
                    select.appendChild(option);
                });
            });
    });
    
    function loadGenealogy() {
        const id = document.getElementById('genealogySelect').value;
        if (!id) return;
        
        fetch(`/api/genealogy/${id}/gojs_data/`)
            .then(r => r.json())
            .then(data => {
                initializeGenealogy(data);
                updateStats(data.metadata);
            });
    }
    
    function updateStats(metadata) {
        document.getElementById('totalPeople').textContent = metadata.totalPeople;
        document.getElementById('totalRelationships').textContent = metadata.totalRelationships;
    }
</script>
{% endblock %}
