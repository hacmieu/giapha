{% extends 'base.html' %}

{% block title %}Đăng Nhập{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-6">
            <div class="text-5xl mb-4">🔐</div>
            <h2 class="text-2xl font-bold text-[#78350f] serif-font">Đăng Nhập</h2>
            <p class="text-gray-500 text-sm mt-1">Đăng nhập để quản lý gia phả</p>
        </div>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="p-3 bg-red-100 text-red-700 rounded-lg text-sm">
                Tên đăng nhập hoặc mật khẩu không đúng.
            </div>
            {% endif %}
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
                <input type="text" name="username" required autofocus
                    class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[#78350f]"
                    placeholder="Nhập tên đăng nhập">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
                <input type="password" name="password" required
                    class="w-full border border-gray-300 rounded-lg p-3 focus:ring-2 focus:ring-[#78350f]"
                    placeholder="Nhập mật khẩu">
            </div>
            
            <button type="submit" class="w-full bg-[#78350f] text-white font-bold py-3 rounded-lg hover:bg-[#92400e] transition">
                Đăng Nhập
            </button>
        </form>
        
        <div class="mt-6 text-center text-sm text-gray-500">
            <p>Chưa có tài khoản? <a href="{% url 'accounts:register' %}" class="text-[#78350f] hover:underline font-semibold">Đăng ký</a></p>
        </div>
    </div>
</div>
{% endblock %}
