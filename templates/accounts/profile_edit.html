{% extends 'base.html' %}

{% block title %}Sửa Hồ Sơ{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-white rounded-xl shadow-lg p-8">
        <h2 class="text-2xl font-bold text-[#78350f] mb-6 serif-font text-center">Sửa Thông Tin Cá Nhân</h2>

        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="p-3 bg-red-100 text-red-700 rounded-lg text-sm">
                {% for field, errors in form.errors.items %}
                    {% for error in errors %}
                    <p>{{ error }}</p>
                    {% endfor %}
                {% endfor %}
            </div>
            {% endif %}
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Họ</label>
                    <input type="text" name="last_name" value="{{ form.last_name.value|default:'' }}"
                        class="w-full border border-gray-300 rounded-lg p-2.5">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tên</label>
                    <input type="text" name="first_name" value="{{ form.first_name.value|default:'' }}"
                        class="w-full border border-gray-300 rounded-lg p-2.5">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" value="{{ form.email.value|default:'' }}"
                    class="w-full border border-gray-300 rounded-lg p-2.5">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
                <input type="tel" name="phone" value="{{ form.phone.value|default:'' }}"
                    class="w-full border border-gray-300 rounded-lg p-2.5">
            </div>
            
            <div class="flex gap-3 pt-4">
                <button type="submit" class="flex-1 bg-[#78350f] text-white font-bold py-3 rounded-lg hover:bg-[#92400e] transition">
                    💾 Lưu
                </button>
                <a href="{% url 'accounts:profile' %}" class="px-6 py-3 border border-gray-300 rounded-lg hover:bg-gray-100 transition text-center">
                    Hủy
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
